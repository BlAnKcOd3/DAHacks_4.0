<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - Community Wishboard</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f7f7f7; margin: 0; padding: 0; }
        .container { max-width: 400px; margin: 60px auto; background: #fff; padding: 32px; border-radius: 8px; box-shadow: 0 2px 8px #ccc; }
        h1 { text-align: center; color: #2d6a4f; }
        form { display: flex; flex-direction: column; gap: 12px; }
        input[type="text"] { padding: 10px; border-radius: 4px; border: 1px solid #ccc; }
        button { background: #2d6a4f; color: #fff; border: none; border-radius: 4px; padding: 10px 0; cursor: pointer; font-size: 1em; }
        button:hover { background: #40916c; }
        .warn { color: #d90429; font-size:1em; font-weight:bold; margin-top:8px; text-align:center; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Device Identification</h1>
        <form id="deviceIdForm">
            <input type="text" id="username" placeholder="Enter your name (for this device)" required maxlength="32">
            <button type="submit">Continue</button>
        </form>
        <div class="warn">⚠️ This is NOT a secure login! Your name is only saved for this browser/device. Anyone using or modifying this device can access or impersonate your posts. Do NOT use for sensitive information.</div>
    </div>
    <script>
        function getDeviceId() {
            const data = [
                navigator.userAgent,
                navigator.language,
                screen.width,
                screen.height,
                screen.colorDepth,
                navigator.platform,
                navigator.hardwareConcurrency
            ].join('|');
            let hash = 0;
            for (let i = 0; i < data.length; i++) {
                hash = ((hash << 5) - hash) + data.charCodeAt(i);
                hash |= 0;
            }
            return 'dev-' + Math.abs(hash);
        }
        document.getElementById('deviceIdForm').onsubmit = function(e) {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            if (!username) return;
            localStorage.setItem('wishboard_user', username);
            localStorage.setItem('wishboard_device_id', getDeviceId());
            window.location.href = 'wishboard.html';
        };
        // Auto-redirect if already identified
        if (localStorage.getItem('wishboard_device_id') === getDeviceId()) {
            window.location.href = 'wishboard.html';
        }
    </script>
</body>
</html>
